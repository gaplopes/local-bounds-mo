name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_TESTS=ON
        -DBUILD_EXAMPLES=ON
        -DBUILD_BENCHMARK=OFF

    - name: Build
      run: cmake --build build --parallel

    - name: Test
      run: ctest --test-dir build --output-on-failure

  python-and-visualization:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install wheel with visualization and test dependencies
      run: python -m pip install ".[vis,test]"
    - name: Test Python bindings and visualization
      run: python -m pytest tests/test_python_bindings.py tests/test_visualization.py
    - name: Verify installed dashboard outside checkout
      working-directory: /tmp
      run: python -c "from visualization.app import app; assert app.test_client().get('/').status_code == 200"
